<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group 55 AR Project</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <script>
      // color change on click
      AFRAME.registerComponent("color-changer", {
        init: function () {
          const colors = ["yellow", "cyan", "pink", "magenta", "orange"];
          let index = 0;
          this.el.addEventListener("click", () => {
            index = (index + 1) % colors.length;
            this.el.setAttribute("color", colors[index]);
          });
        },
      });

      // Toggles the sphere between vertical bouncing and horizontal bouncing on click
      AFRAME.registerComponent("toggle-sphere-animation", {
        init: function () {
          let isVertical = true;
          this.el.addEventListener("click", () => {
            isVertical = !isVertical;
            if (isVertical) {
              // Restores vertical bouncing
              this.el.setAttribute(
                "animation",
                "property: position; from: 0.6 0.4 0; to: 0.6 0.8 0; dir: alternate; dur: 700; easing: easeInOutQuad; loop: true",
              );
            } else {
              // Changes to horizontal bouncing along the X-axis
              this.el.setAttribute(
                "animation",
                "property: position; from: 0.4 0.5 0; to: 0.8 0.5 0; dir: alternate; dur: 700; easing: easeInOutQuad; loop: true",
              );
            }
          });
        },
      });

      // Status banner
      AFRAME.registerComponent("marker-status", {
        init: function () {
          const banner = document.querySelector("#status");
          this.el.addEventListener("markerFound", () => {
            banner.textContent = "Marker FOUND";
            banner.style.background = "green";
          });
          this.el.addEventListener("markerLost", () => {
            banner.textContent = "Marker LOST";
            banner.style.background = "red";
          });
        },
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        padding: 10px;
        text-align: center;
        color: white;
        font-family: sans-serif;
        background: red;
      }
    </style>
  </head>

  <body>
    <div id="status">Looking for marker...</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets timeout="20000">
        <a-asset-item
          id="optimus-model"
          src="models/optimus_prime.glb"
        ></a-asset-item>
      </a-assets>

      <a-marker preset="hiro" marker-status>
        <a-plane
          rotation="-90 0 0"
          width="1.6"
          height="1.6"
          color="navy"
        ></a-plane>

        <!-- Animation 1: Rotation -->
        <a-entity
          gltf-model="#optimus-model"
          position="0 0 0"
          scale="0.4 0.4 0.4"
          animation="property: rotation; from: -90 0 0; to: 90 0 0;
                           dur: 8000; easing: linear; dir: alternate; loop: true"
        ></a-entity>

        <!-- Animation 2: Toggles between vertical and horizontal bouncing when clicked -->
        <a-sphere
          class="clickable"
          toggle-sphere-animation
          position="0.6 0.5 0"
          radius="0.2"
          color="red"
          animation="property: position; from: 0.6 0.4 0; to: 0.6 0.8 0;
                           dir: alternate; dur: 700;
                           easing: easeInOutQuad; loop: true"
        ></a-sphere>

        <!-- Animation 3: Pulses by default, changes color when clicked -->
        <a-cylinder
          class="clickable"
          color-changer
          position="-0.6 0.25 0"
          radius="0.2"
          height="0.5"
          color="yellow"
          animation="property: scale; from: 1 1 1; to: 1.4 1.4 1.4;
                             dir: alternate; dur: 600; loop: true"
        ></a-cylinder>

        <a-text
          value="** THIS IS GROUP 55 **"
          position="0 1.5 0"
          align="center"
          width="4"
          color="white"
        ></a-text>
      </a-marker>

      <a-entity
        camera
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      ></a-entity>
    </a-scene>
  </body>
</html>
